name: Paramqua public health

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/health.yml'
      - 'index.html'
      - 'app.js'
      - 'inference.js'
      - 'model.json'
      - 'examples.json'

permissions:
  contents: read

jobs:
  public-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public page, model, and prediction
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://paramqua.vercel.app';
          async function get(path) {
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(base + path, {
                  signal: AbortSignal.timeout(20000),
                  headers: { 'cache-control': 'no-cache' }
                });
                assert.equal(response.status, 200, path + ' returned HTTP ' + response.status);
                return await response.text();
              } catch (error) {
                last = error;
                if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            throw new Error(path + ': ' + last.message);
          }
          const page = await get('/');
          assert.match(page, /Paramqua — Explore water parameters/);
          const [app, inference, rawModel, rawExamples] = await Promise.all([
            get('/app.js'), get('/inference.js'), get('/model.json'), get('/examples.json')
          ]);
          assert.match(app, /model\.json/);
          const model = JSON.parse(rawModel);
          const examples = JSON.parse(rawExamples);
          assert.equal(model.features.length, 9);
          assert.equal(model.threshold, 0.5);
          assert.ok(model.sv.length > 0 && model.sha256);
          assert.ok(Array.isArray(examples) && examples.length > 1);
          const moduleUrl = 'data:text/javascript;base64,' + Buffer.from(inference).toString('base64');
          const { predict } = await import(moduleUrl);
          const values = Object.fromEntries(model.features.map((name, index) => [
            name, examples[1].values[index]
          ]));
          const result = predict(model, values);
          assert.equal(result.prediction, 0);
          assert.ok(result.probability > 0.25 && result.probability < 0.27);
          console.log('Public page and assets loaded; example prediction:', result);
          NODE
